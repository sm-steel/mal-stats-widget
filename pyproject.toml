[project]
name = "mal-stats-widget"
version = "0.1.0"
description = "MyAnimeList stats card for the sm-steel GitHub profile README"
requires-python = ">=3.12"
dependencies = []

[tool.vercel]
entrypoint = "api.mal:handler"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins (don't shadow builtins)
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez (catch naive datetimes)
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "ERA",   # eradicate (commented-out code)
    "ASYNC", # flake8-async (blocking calls in async handlers)
    "PERF",  # perflint
    "S",     # flake8-bandit (security)
    "RUF",   # ruff-specific rules
]
ignore = [
    "S101",  # assert is fine outside tests too
    "S311",  # `random` is used for gacha rolls, not crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]  # pytest fixtures are passed but often unused

[tool.ty.rules]
division-by-zero = "warn"          # default: ignore
blanket-ignore-comment = "warn"    # default: ignore; require rule-specific `ty: ignore[...]`
